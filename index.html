<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>谜之食谱世界｜狩猎版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            box-sizing: border-box
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f3ea;
            color: #29251f
        }
        button,
        input,
        select {
            font: inherit
        }
        button {
            cursor: pointer
        }
        .wrap {
            max-width: 900px;
            margin: auto;
            padding: 20px
        }
        .card {
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            margin: 14px 0;
            box-shadow: 0 4px 18px #0001
        }
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }
        .muted {
            color: #777
        }
        .ok {
            color: #16753a
        }
        .err {
            color: #b3261e
        }
        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #fff
        }
        .primary {
            background: #29251f;
            color: #fff;
            border: 0;
            padding: 11px 15px;
            border-radius: 10px
        }
        .secondary {
            background: #eee9df;
            color: #29251f;
            border: 0;
            padding: 11px 15px;
            border-radius: 10px
        }
        .primary:disabled,
        .secondary:disabled {
            opacity: .55;
            cursor: not-allowed
        }
        .stat {
            display: inline-block;
            background: #f1eee6;
            border-radius: 12px;
            padding: 10px 14px;
            margin: 4px
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px
        }
        #game {
            display: none
        }
        #userBox {
            display: none
        }
        .app {
            display: none
        }
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px
        }
        .menuBtn {
            font-size: 22px;
            padding: 8px 12px;
            background: #29251f;
            color: #fff;
            border: 0;
            border-radius: 10px
        }
        .side {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 270px;
            background: #fff;
            box-shadow: 4px 0 20px #0002;
            z-index: 20;
            padding: 22px 16px;
            transform: translateX(-105%);
            transition: .2s;
            overflow-y: auto
        }
        .side.open {
            transform: translateX(0)
        }
        .side h2 {
            margin-top: 4px
        }
        .navbtn {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: #f3f0e8;
            color: #29251f;
            padding: 14px;
            border-radius: 12px;
            margin: 8px 0
        }
        .navbtn.active {
            background: #29251f;
            color: #fff
        }
        .navbtn.admin {
            border-left: 4px solid #b3261e
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0005;
            z-index: 19
        }
        .overlay.show {
            display: block
        }
        .section {
            display: none
        }
        .section.active {
            display: block
        }
        .inventoryItem,
        .monsterItem,
        .mapItem {
            border: 1px solid #e5e0d6;
            border-radius: 14px;
            padding: 14px;
            margin: 10px 0
        }
        .inventoryItem b,
        .monsterItem b,
        .mapItem b {
            font-size: 17px
        }
        .badge {
            float: right;
            background: #29251f;
            color: #fff;
            border-radius: 999px;
            padding: 3px 9px;
            font-size: 13px
        }
        .mapItem.selected {
            border: 2px solid #29251f;
            background: #f8f6f0
        }
        .modalBack {
            display: none;
            position: fixed;
            inset: 0;
            background: #0007;
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 15px
        }
        .modalBack.show {
            display: flex
        }
        .modal {
            width: min(680px, 100%);
            max-height: 92vh;
            overflow: auto;
            background: #fff;
            border-radius: 20px;
            padding: 22px
        }
        .attrGrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px
        }
        .small {
            font-size: 13px
        }
        .huntResult {
            padding: 14px;
            border-radius: 14px;
            background: #f8f6f0;
            margin-top: 12px;
            white-space: pre-line
        }
        .battleHud {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0
        }
        .fighter {
            border: 1px solid #e5e0d6;
            border-radius: 16px;
            padding: 14px;
            background: #f8f6f0
        }
        .fighterTitle {
            font-weight: 700;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            gap: 8px
        }
        .hpbar {
            height: 12px;
            background: #ddd6c9;
            border-radius: 99px;
            overflow: hidden;
            margin: 8px 0
        }
        .hpfill {
            height: 100%;
            background: #29251f;
            transition: width .25s
        }
        .battleLog {
            height: 180px;
            overflow: auto;
            background: #171511;
            color: #f8f6f0;
            border-radius: 14px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.65
        }
        .battleActions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px
        }
        .battleActions button {
            min-height: 48px
        }
