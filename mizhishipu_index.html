<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>谜之食谱世界</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f3ea;color:#29251f}
.wrap{max-width:720px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}
input,button{font:inherit;padding:11px 13px;border-radius:10px;border:1px solid #ccc}input{width:100%;box-sizing:border-box}button{cursor:pointer;background:#29251f;color:white;border:0}
.row{display:flex;gap:10px;flex-wrap:wrap}.stat{display:inline-block;background:#f1eee6;border-radius:12px;padding:10px 14px;margin:4px}.muted{color:#777}.ok{color:#16753a}.err{color:#b3261e}
#game,#userBox{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🍲 谜之食谱世界</h1>
<div id="auth" class="card">
<h2>冒险者登录</h2>
<input id="email" type="email" placeholder="邮箱"><br><br>
<input id="password" type="password" placeholder="密码"><br><br>
<input id="username" placeholder="账号名（注册时填写）"><br><br>
<input id="nickname" placeholder="昵称（注册时填写）"><br><br>
<div class="row"><button onclick="login()">登录</button><button onclick="signup()">注册</button></div>
<p id="msg" class="muted"></p>
</div>
<div id="userBox" class="card"><div class="row"><strong id="who"></strong><button onclick="logout()">退出</button></div></div>
<div id="game">
<div class="card"><h2>🧙 冒险者状态</h2><div id="stats"></div></div>
<div class="card"><h2>📅 每日签到</h2><button onclick="signin()">签到 +500 金币</button><p id="signinMsg" class="muted"></p></div>
<div class="card"><h2>🛏️ 旅店</h2><button onclick="rest()">休息并恢复到 5 AP</button><p id="restMsg" class="muted"></p></div>
<div class="card"><h2>🍜 食谱挑战</h2><button onclick="newWord()">抽取题目</button><div id="wordBox" style="margin-top:12px"></div></div>
</div>
</div>
<script>
const SUPABASE_URL="https://sayzluvdkxscbzvaigja.supabase.co";
const SUPABASE_KEY="sb_publishable_0FU46ikX3BapZYxXDRVKrA_K5jLe2K0";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
function msg(t,c="muted"){const e=document.getElementById("msg");e.textContent=t;e.className=c}
async function signup(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const username=document.getElementById("username").value.trim(),nickname=document.getElementById("nickname").value.trim();
 if(!email||!password||!username||!nickname)return msg("注册请填写完整。","err");
 const {error}=await db.auth.signUp({email,password,options:{data:{username,nickname}}});
 if(error)return msg(error.message,"err"); msg("注册成功！如需验证邮箱，请先完成验证后再登录。","ok");
}
async function login(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error)return msg(error.message,"err"); await loadGame();
}
async function logout(){await db.auth.signOut();location.reload()}
async function loadGame(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){document.getElementById("auth").style.display="block";return}
 currentUser=user;document.getElementById("auth").style.display="none";document.getElementById("userBox").style.display="block";document.getElementById("game").style.display="block";
 document.getElementById("who").textContent="👋 "+(user.user_metadata?.nickname||user.email);await loadProfile();
}
async function loadProfile(){
 const {data,error}=await db.from("profiles").select("*").eq("id",currentUser.id).single();
 if(error){document.getElementById("stats").innerHTML='<span class="err">读取角色资料失败：'+error.message+'</span>';return}
 document.getElementById("stats").innerHTML=[["💰金币",data.coins],["⚡AP",data.action_points],["🧩技巧",data.technique],["💪耐力",data.endurance],["👅味觉",data.taste],["✨魔力感知",data.magic_sense],["👃嗅觉",data.smell],["📖熟练度",data.proficiency],["🏆等级",data.level],["⭐分数",data.score]].map(x=>`<span class="stat"><b>${x[0]}</b> ${x[1]}</span>`).join("");
}
async function signin(){
 const {data,error}=await db.rpc("daily_signin"),e=document.getElementById("signinMsg");
 if(error){e.textContent=error.message;e.className="err";return} if(data===-1){e.textContent="今天已经签到过啦！";return}
 e.textContent="签到成功！当前金币："+data;e.className="ok";await loadProfile();
}
async function rest(){
 const {data,error}=await db.rpc("rest_at_inn"),e=document.getElementById("restMsg");
 if(error){e.textContent=error.message;e.className="err";return} if(data===-1){e.textContent="旅店冷却中，1小时后才能再次休息。";return}
 e.textContent="休息成功！AP 已恢复到 "+data+"。";e.className="ok";await loadProfile();
}
async function newWord(){
 const {data,error}=await db.from("words").select("id,word,hint,answer,difficulty").eq("enabled",true),box=document.getElementById("wordBox");
 if(error){box.innerHTML='<span class="err">'+error.message+'</span>';return} if(!data?.length){box.textContent="词库暂无启用题目。";return}
 const w=data[Math.floor(Math.random()*data.length)];
 box.innerHTML=`<h3>${w.word}</h3><p>提示：${w.hint||"暂无提示"}</p><input id="answerInput" placeholder="输入答案"><br><br><button onclick='checkAnswer(${JSON.stringify(w.answer)})'>提交答案</button><p id="answerMsg" class="muted"></p>`;
}
function checkAnswer(a){const g=document.getElementById("answerInput").value.trim(),e=document.getElementById("answerMsg");e.textContent=g===a?"🎉 答对了！":"❌ 不对，再想想。";e.className=g===a?"ok":"err"}
db.auth.onAuthStateChange(()=>loadGame());loadGame();
</script>
</body>
</html>
